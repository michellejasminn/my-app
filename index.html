<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Loan Application</h1>

    <form name="loanForm" onsubmit="return validateForm()">
        <div>
            <label>Name:</label>
            <input type="text" name="name">
        </div>

        <div>
            <label>Age:</label>
            <input type="text" name="age">
        </div>

        <div>
            <label>Monthly Income (Rp):</label>
            <input type="text" name="monthly-income">
        </div>

        <div>
            <label>Monthly Debt (Rp):</label>
            <input type="text" name="monthly-debt">
        </div>

        <div>
            <label>Loan Amount Requested:(Rp)</label>
            <input type="text" name="loan-amount">
        </div>

        <button type="submit">Submit</button>
    </form>

    <script>
        function validateForm() {
            let form = document.forms["loanForm"];
            let age = Number(form.elements["age"].value);
            let monthlyIncome = Number(form.elements["monthly-income"].value);
            let monthlyDebt = Number(form.elements["monthly-debt"].value);
            let loanAmount = Number(form.elements["loan-amount"].value);

            if (age < 21) {
                alert("You are not eligible for a loan. (Minimum age is 21)");
            } else if (monthlyIncome < 5000000) {
                alert("You are not eligible for a loan. (Minimum income is Rp5,000,000)");
            } else if (monthlyDebt > 0.7 * monthlyIncome) {
                alert("You are not eligible for a loan. (Monthly debt exceeds 70% of monthly income)");
            } else if (loanAmount > 5 * monthlyIncome) {
                alert("You are not eligible for a loan. (Loan amount exceeds 5x monthly income)");
            } else {
                alert("You are eligible for a loan.");
            }

            return false;
        }
    </script>
</body>
</html>
